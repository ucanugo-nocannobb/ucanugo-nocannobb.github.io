<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 260px; margin: 0; padding: 14px 16px; font: 14px system-ui, -apple-system, 'Segoe UI', 'Microsoft JhengHei', sans-serif; color: #111827; background: #fff; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; gap: 10px; }
    select, input[type=range] { flex: 1; max-width: 140px; }
    select { padding: 4px; border-radius: 6px; border: 1px solid #d1d5db; }
    .hint { font-size: 12px; color: #6b7280; margin-top: 12px; line-height: 1.5; }
    @media (prefers-color-scheme: dark) {
      body { background: #1f2937; color: #f3f4f6; }
      select { background: #111827; color: #f3f4f6; border-color: #4b5563; }
      .hint { color: #9ca3af; }
    }
  </style>
</head>
<body>
  <h1>🎬 影片字幕即時翻譯</h1>
  <label>啟用 <input type="checkbox" id="enabled" /></label>
  <label>翻譯成
    <select id="target">
      <option value="zh-TW">繁體中文</option>
      <option value="zh-CN">简体中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="vi">Tiếng Việt</option>
      <option value="th">ภาษาไทย</option>
      <option value="id">Bahasa Indonesia</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
    </select>
  </label>
  <label>顯示方式
    <select id="mode">
      <option value="bilingual">雙語（原文＋譯文）</option>
      <option value="translation">只顯示譯文</option>
    </select>
  </label>
  <label>字級 <input type="range" id="fontSize" min="14" max="44" step="2" /></label>
  <div class="hint">記得先在影片播放器裡把「字幕 / CC」打開，擴充功能會把那條字幕即時翻譯出來。</div>
  <script src="popup.js"></script>
</body>
</html>
