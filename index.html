    // Seeded LCG — 讓打亂後每次重載結果一致
    function seededRng(seed) {
      let s = (seed ^ 0xdeadbeef) >>> 0;
      return () => {
        s = Math.imul(s ^ (s >>> 16), 0x45d9f3b);
        s = Math.imul(s ^ (s >>> 16), 0x45d9f3b);
        s = (s ^ (s >>> 16)) >>> 0;
        return s / 4294967296;
      };
    }

    // Fisher-Yates shuffle（seeded），回傳打亂後的 URL 陣列
    function buildCellCombos(images, seed) {
      const arr = [...images];
      const rng = seededRng(seed);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }

    const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];
    const MONTHS   = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];

    function getDaysInMonth(year, month) { return new Date(year, month + 1, 0).getDate(); }
    function getFirstDayOfWeek(year, month) { return new Date(year, month, 1).getDay(); }
    function dateKey(year, month, day) { return `${year}-${month + 1}-${day}`; }

    function makeSchedule(seed, baseYear = new Date().getFullYear()) {
      const schedule = {};
      const types = ['morning', 'mid', 'night', 'off'];
      for (let month = 1; month <= 12; month++) {
        for (let day = 1; day <= 31; day++) {
          const val = (seed * day * month + day + month) % 5;
          if (val < 4) schedule[`${baseYear}-${month}-${day}`] = types[val];
        }
      }
      return schedule;
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

      async function handlePaste(e) {
