      // ── Adaptive binarization (Bradley-Roth method) ─────────────────
      // 每個像素的門檻值 = 局部鄰域平均值 − C
      // 解決問題：全域門檻對有色底格無效；自適應門檻能處理橘/黃/白格底色差異
      function adaptiveBinarize(imageData, blockSize, C) {
        const { data, width, height } = imageData;
        // 積分圖（Summed-area table）讓任意矩形區域的求和為 O(1)
        const S = new Float64Array(width * height);
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const gray = data[(y * width + x) * 4];
            S[y * width + x] = gray
              + (y > 0 ? S[(y-1) * width + x] : 0)
              + (x > 0 ? S[y * width + (x-1)] : 0)
              - (x > 0 && y > 0 ? S[(y-1) * width + (x-1)] : 0);
          }
        }
        const half = Math.floor(blockSize / 2);
        const out  = new Uint8ClampedArray(data.length);
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const x1 = Math.max(0, x - half), x2 = Math.min(width  - 1, x + half);
            const y1 = Math.max(0, y - half), y2 = Math.min(height - 1, y + half);
            const area = (x2 - x1 + 1) * (y2 - y1 + 1);
            const sum  = S[y2*width+x2]
                       - (x1>0 ? S[y2*width+(x1-1)] : 0)
                       - (y1>0 ? S[(y1-1)*width+x2] : 0)
                       + (x1>0&&y1>0 ? S[(y1-1)*width+(x1-1)] : 0);
            const localMean = sum / area;
            const gray = data[(y * width + x) * 4];
            const v = gray >= localMean - C ? 255 : 0;
            const i = (y * width + x) * 4;
            out[i] = out[i+1] = out[i+2] = v; out[i+3] = 255;
          }
        }
        return new ImageData(out, width, height);
      }

      // 影像前處理：放大 → 灰階 → 自適應二值化
      // 載入圖片 → 放大 → 灰階，回傳灰階 ImageData + 畫布尺寸（只做一次）
      async function loadGrayscale(imgFile) {
        return new Promise(resolve => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.max(1, Math.min(4, 3000 / img.width));
            const canvas = document.createElement('canvas');
            canvas.width  = Math.round(img.width  * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.filter = 'grayscale(1)';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'none';
            resolve({ gray: ctx.getImageData(0, 0, canvas.width, canvas.height), canvas, ctx });
          };
          img.src = URL.createObjectURL(imgFile);
        });
      }

      // 對同一張灰階圖，用不同二值化參數產生多個變體 blob（用於投票）
      async function preprocessVariants(imgFile, paramsList) {
        const { gray, canvas, ctx } = await loadGrayscale(imgFile);
        const variants = [];
        for (const p of paramsList) {
          const bin = adaptiveBinarize(gray, p.blockSize, p.C);
          ctx.putImageData(bin, 0, 0);
          const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
          variants.push({ blob, previewUrl: URL.createObjectURL(blob), params: p });
        }
        return variants;
      }

      // 多參數變體 + 單一 worker，回傳每個變體的 OCR 結果（供投票）
      async function callTesseractMulti(imgFile, onProgress, onPreview) {
        onProgress('載入 OCR 引擎...');
        if (!window.Tesseract) {
          await new Promise((res, rej) => {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
            s.onload = res;
            s.onerror = () => rej(new Error('無法載入 Tesseract.js，請確認網路連線'));
            document.head.appendChild(s);
          });
        }

        onProgress('影像前處理（多參數）...');
        // 三組二值化參數：小窗高敏感 / 中性 / 大窗抗噪
        const paramsList = [
          { blockSize: 15, C: 6 },
          { blockSize: 25, C: 8 },
          { blockSize: 41, C: 10 },
        ];
        const variants = await preprocessVariants(imgFile, paramsList);
        if (onPreview && variants[1]?.previewUrl) onPreview(variants[1].previewUrl);

        const worker = await Tesseract.createWorker('chi_tra+eng', 1, {
          logger: m => {
            if (m.status === 'loading language traineddata')
              onProgress(`下載語言包... ${Math.round(m.progress * 100)}%`);
          },
        });
        await worker.setParameters({ tessedit_pageseg_mode: '6' });

        const results = [];
        try {
          for (let i = 0; i < variants.length; i++) {
            onProgress(`辨識中... (${i + 1}/${variants.length})`);
            const { data } = await worker.recognize(variants[i].blob);
            results.push(data);
          }
          return results;
        } finally {
          await worker.terminate();
        }
      }

      // ── 位置式解析（專為「顏色代表班別、只有休字有文字」的班表）──
      // 利用 OCR word bounding-box，按 x 座標推算「休」落在第幾天
      function parseWithPositions(ocrData, personName, daysInMonth) {
        const words = (ocrData.words || []).filter(w => w.text && w.text.trim() && w.confidence > 10);
        if (!words.length) return null;

        function charOverlap(a, b) {
          if (!a || !b) return 0;
          const shorter = a.length <= b.length ? a : b;
          let hits = 0;
          for (const ch of shorter) if (b.includes(ch)) hits++;
          return hits / shorter.length;
        }

        const imgW = Math.max(...words.map(w => w.bbox.x1));
        const minRatio = personName.length <= 2 ? 0.49 : 0.6;

        // ── 1. 人名欄（圖片最左 18%）——名字永遠在最左欄
        const nameColCutoff = imgW * 0.18;
        const nameColWords  = words.filter(w =>
          w.bbox.x1 <= nameColCutoff && w.text.trim().length >= 1 && w.text.trim().length <= 6
        );

        // ── 2. 在人名欄內模糊比對人名
        const scored = nameColWords.map(w => {
          const t = w.text.replace(/\s/g, '');
          let s = charOverlap(personName, t);
          if (t.includes(personName)) s = 1.0;
          else if (personName.length >= 2 && [...personName].every(ch => t.includes(ch))) s = 0.9;
          return { w, s };
        }).filter(({ s }) => s >= minRatio).sort((a, b) => b.s - a.s);

        if (!scored.length) return null;

        // ── 3. 去重：同一水平列只保留最高分（避免相同行有多個字重複計算）
        const nameRows = [];
        const usedCY   = [];
        for (const { w } of scored) {
          const cy = (w.bbox.y0 + w.bbox.y1) / 2;
          const h  = Math.max(w.bbox.y1 - w.bbox.y0, 8);
          if (usedCY.every(y => Math.abs(y - cy) > h * 2)) {
            nameRows.push(w);
            usedCY.push(cy);
          }
          if (nameRows.length >= 3) break;
        }
        nameRows.sort((a, b) => a.bbox.y0 - b.bbox.y0);

        // ── 4. 從人名欄所有 word 的 y 間距，估算真實列高
        const nameColYs = [...new Set(
          nameColWords.map(w => Math.round((w.bbox.y0 + w.bbox.y1) / 2))
        )].sort((a, b) => a - b);

        const gaps = [];
        for (let i = 1; i < nameColYs.length; i++) {
          const g = nameColYs[i] - nameColYs[i - 1];
          if (g > 4) gaps.push(g);
        }
        gaps.sort((a, b) => a - b);
        const rowH = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 20; // 中位數列高

        // ── 5. 找所有「休」word
        const allOff = words.filter(w => /休/.test(w.text));

        // ── 6. 逐個人名列提取休假日
        const result = {};

        nameRows.forEach((nw, ni) => {
          const nameCY   = (nw.bbox.y0 + nw.bbox.y1) / 2;
          const yTol     = rowH * 0.45; // 嚴格限定：只取 ±45% 列高內的字

          // 此列的所有 word（名字右側開始）
          const rowWords = words.filter(w => {
            const cy = (w.bbox.y0 + w.bbox.y1) / 2;
            return Math.abs(cy - nameCY) < yTol && w.bbox.x0 >= nameColCutoff - 5;
          });
          const dataEndX = rowWords.length
            ? Math.max(...rowWords.map(w => w.bbox.x1))
            : imgW;
          const dataStartX = nameColCutoff;
          const dataWidth  = dataEndX - dataStartX;
          if (dataWidth < 50) return;

          // 此段涵蓋天數：用 floor 讓前段少、後段多（符合 1~15 / 16~31 慣例）
          let sectionStart, sectionEnd;
          if (nameRows.length === 1) {
            sectionStart = 1;
            sectionEnd   = daysInMonth;
          } else {
            const firstLen = Math.floor(daysInMonth / nameRows.length);
            sectionStart = ni * firstLen + 1;
            sectionEnd   = ni === nameRows.length - 1 ? daysInMonth : (ni + 1) * firstLen;
          }
          const sectionDays = sectionEnd - sectionStart + 1;
          const colW = dataWidth / sectionDays;

          // 此列的休字（嚴格 yTol 過濾）
          const rowOff = allOff.filter(w => {
            const cy = (w.bbox.y0 + w.bbox.y1) / 2;
            return Math.abs(cy - nameCY) < yTol && w.bbox.x0 >= dataStartX - 5;
          });

          rowOff.forEach(ow => {
            const cx  = (ow.bbox.x0 + ow.bbox.x1) / 2;
            const col = Math.round((cx - dataStartX) / colW);
            const day = sectionStart + col;
            if (day >= 1 && day <= daysInMonth) result[String(day)] = 'off';
          });
        });

        if (!Object.keys(result).length) return null;
        return { _onlyOff: true, ...result };
      }

      function parseOCRToSchedule(text, personName, month, daysInMonth) {
        function toShift(s) {
          if (!s) return null;
          s = s.trim();
          if (/早|白班|A班|日班|上午/.test(s)) return 'morning';
          if (s === '中' || /中班|B班|午班|下午班/.test(s)) return 'mid';
          if (/晚|夜班|C班|大夜|小夜/.test(s) || s === '夜') return 'night';
          if (s === '休' || /休假|休息|OFF|例假|公休/.test(s)) return 'off';
          return null;
        }

        const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

        // 模糊名字比對：計算兩字串共同字元比例
        function charOverlap(a, b) {
          if (!a || !b) return 0;
          const shorter = a.length <= b.length ? a : b;
          let hits = 0;
          for (const ch of shorter) if (b.includes(ch)) hits++;
          return hits / shorter.length;
        }

        // 先嘗試精確比對，再退而求其次用模糊比對
        let nameIdx = lines.findIndex(l => l.includes(personName));
        if (nameIdx < 0 && personName.length >= 2) {
          // 嘗試每個字都出現在同一行（順序不拘）
          nameIdx = lines.findIndex(l =>
            [...personName].every(ch => l.includes(ch))
          );
        }
        if (nameIdx < 0 && personName.length >= 2) {
          // 允許 1 字錯誤（2字名只要1字匹配，3字以上要60%）
          const minRatio = personName.length <= 2 ? 0.49 : 0.6;
          nameIdx = lines.findIndex(l => charOverlap(personName, l) >= minRatio);
        }
        if (nameIdx < 0) return null;

        // 抓出找到的行中最接近名字的片段，之後的部分視為班表
        const matchedLine = lines[nameIdx];
        // 找到名字在行中的大約位置後截斷
        let afterNameText = matchedLine;
        if (matchedLine.includes(personName)) {
          afterNameText = matchedLine.slice(matchedLine.indexOf(personName) + personName.length);
        } else {
          // 模糊比對時，嘗試從第一個班別字元或數字開始
          const firstShiftIdx = matchedLine.search(/[早中晚休夜白\d]/);
          afterNameText = firstShiftIdx >= 0 ? matchedLine.slice(firstShiftIdx) : matchedLine;
        }

        // 策略一：從名字那行後面提取班別（搜尋更多行，因為班表可能跨行）
        // 班表圖通常名字行之後緊接著是當月班別，掃描最多 8 行
        const windowEnd = Math.min(lines.length, nameIdx + 8);
        const searchText = [afterNameText, ...lines.slice(nameIdx + 1, windowEnd)].join(' ');
        const afterName = searchText.trim();

        // 嘗試抓出所有單字班別字元（早/中/晚/休/夜/白）
        const singleChars = afterName.match(/[早中晚休夜白]/g) || [];
        if (singleChars.length >= 10) {
          const result = {};
          singleChars.slice(0, daysInMonth).forEach((c, i) => {
            const shift = toShift(c);
            if (shift) result[String(i + 1)] = shift;
          });
          if (Object.keys(result).length >= 10) return result;
        }

        // 策略二：空白分隔的 token
        const tokens = afterName.split(/[\s　，,\t]+/).filter(Boolean);
        const result = {};
        let day = 1;
        for (const token of tokens) {
          if (day > daysInMonth) break;
          const shift = toShift(token);
          if (shift) { result[String(day)] = shift; day++; }
          else if (/^\d{1,2}$/.test(token)) {
            const n = parseInt(token);
            if (n >= 1 && n <= daysInMonth) day = n;
          }
        }
        if (Object.keys(result).length >= 5) return result;

        // 策略三：只有「休」班 — 這種班表用顏色代表班別，只有休假日有文字
        // 此時只能匯入休假日，其他日預設為空
        if (singleChars.length >= 1) {
          const offResult = {};
          let offDay = 1;
          for (const c of singleChars) {
            if (offDay > daysInMonth) break;
            if (toShift(c) === 'off') {
              offResult[String(offDay)] = 'off';
              offDay++;
            } else {
              offDay++;
            }
          }
          if (Object.keys(offResult).length >= 1) return { _onlyOff: true, ...offResult };
        }
        return null;
      }

      // ── 文字輸入解析 ──────────────────────────────────────────────
      function parseTextInput(raw, daysInMonth) {
        const SHIFT_MAP = {
          '早': 'morning', '白': 'morning', 'A': 'morning', 'a': 'morning',
          '中': 'mid',     'B': 'mid',      'b': 'mid',
          '晚': 'night',   '夜': 'night',   'C': 'night',   'c': 'night',
          '休': 'off',     'O': 'off',      'o': 'off',     'R': 'off',  'r': 'off',
        };
        function toShift(s) {
          if (!s) return null;
          s = s.trim();
          if (SHIFT_MAP[s]) return SHIFT_MAP[s];
          if (/早|白班|A班|日班|上午/.test(s)) return 'morning';
          if (/^中$|中班|B班|午班/.test(s))    return 'mid';
          if (/晚|夜班|C班|大夜|小夜/.test(s)) return 'night';
          if (/^休$|休假|OFF|例假|公休/i.test(s)) return 'off';
          return null;
        }

        const t = raw.trim();
        const result = {};

        // 格式①：「休 3 7 11 12...」— 只指定休假日
        if (/^休[\s:：\d]/.test(t)) {
          const nums = t.replace(/^休[\s:：]*/, '').match(/\d+/g) || [];
          nums.forEach(d => {
            const n = parseInt(d);
            if (n >= 1 && n <= daysInMonth) result[String(n)] = 'off';
          });
          if (Object.keys(result).length) return { _onlyOff: true, ...result };
        }

        // 格式②：「1早 2中 3休 4晚...」或「1=早 2=中」— 日期+班別對
        let pairHits = 0;
        for (const m of t.matchAll(/(\d{1,2})\s*[=＝]?\s*([早中晚休夜白ABCabc休Oo休Rr])/g)) {
          const day = parseInt(m[1]); const shift = toShift(m[2]);
          if (day >= 1 && day <= daysInMonth && shift) { result[String(day)] = shift; pairHits++; }
        }
        if (pairHits >= 3) return result;

        // 格式③：空白 / 逗號 / 換行分隔的班別序列（每個 token = 第 N 天）
        const tokens = t.split(/[\s,，、\/\n\t]+/).filter(Boolean);
        let day = 1;
        for (const tok of tokens) {
          if (day > daysInMonth) break;
          const shift = toShift(tok);
          if (shift) { result[String(day)] = shift; day++; }
          else if (/^\d{1,2}$/.test(tok)) {
            const n = parseInt(tok);
            if (n >= 1 && n <= daysInMonth) day = n;
          }
        }
        if (Object.keys(result).length >= 3) return result;

        // 格式④：連續單字元「早中晚休早中...」
        const chars = t.replace(/\s/g, '').split('');
        let d2 = 1;
        for (const ch of chars) {
          if (d2 > daysInMonth) break;
          const shift = toShift(ch);
          if (shift) { result[String(d2)] = shift; d2++; }
        }
        return Object.keys(result).length >= 3 ? result : null;
      }

      function runTextImport() {
        if (!textInput.trim()) { setStatusMsg('請輸入班表文字'); setStatus('error'); return; }
        const daysInMonth = new Date(targetYear, targetMonth, 0).getDate();
        const raw = parseTextInput(textInput, daysInMonth);
        if (!raw) { setStatusMsg('無法解析，請確認格式'); setStatus('error'); return; }
        const isOnlyOff = raw._onlyOff === true;
        const schedule = {};
        for (const [day, shift] of Object.entries(raw)) {
          if (day === '_onlyOff') continue;
          if (['morning','mid','night','off'].includes(shift))
            schedule[`${targetYear}-${targetMonth}-${parseInt(day)}`] = shift;
        }
        const count = Object.keys(schedule).length;
        setStatus('preview');
        setPreviewData({ schedule, isOnlyOff: false, count });
      }

      async function runOCR() {
        if (!imageFile)         { setStatusMsg('請上傳班表圖片');     setStatus('error'); return; }
        if (!personName.trim()) { setStatusMsg('請輸入要擷取的人名'); setStatus('error'); return; }
        setStatus('loading');
        try {
          const ocrList = await callTesseractMulti(
            imageFile,
            msg => setStatusMsg(msg),
            showDebug ? url => setProcessedPreview(url) : null
          );
          const daysInMonth = new Date(targetYear, targetMonth, 0).getDate();
          const name = personName.trim();

          // 對每個變體各自解析（位置式優先，否則純文字）
          const parsed = ocrList.map(d => {
            let m = parseWithPositions(d, name, daysInMonth);
            if (!m) m = parseOCRToSchedule(d.text, name, targetMonth, daysInMonth);
            return m;
          }).filter(Boolean);

          if (!parsed.length) {
            const preview = (ocrList[0]?.text || '').split('\n').filter(l=>l.trim()).slice(0,8).join('\n');
            throw new Error(
              `在圖片中找不到「${name}」的班表。\n\nOCR 辨識到的文字：\n${preview}`
            );
          }

          // ── 投票合併：每個 (日,班別) 累計票數，取多數 ──
          const onlyOffCount = parsed.filter(m => m._onlyOff).length;
          const isOnlyOff    = onlyOffCount >= parsed.length / 2;
          const votes = {};  // day -> { shift -> count }
          for (const m of parsed) {
            for (const [day, shift] of Object.entries(m)) {
              if (day === '_onlyOff') continue;
              (votes[day] = votes[day] || {})[shift] = (votes[day]?.[shift] || 0) + 1;
            }
          }
          const threshold = parsed.length >= 3 ? 2 : 1; // 3 變體需 2 票，否則 1 票
          const schedule = {};
          for (const [day, shiftCounts] of Object.entries(votes)) {
            const [bestShift, cnt] = Object.entries(shiftCounts).sort((a, b) => b[1] - a[1])[0];
            if (cnt >= threshold && ['morning','mid','night','off'].includes(bestShift))
              schedule[`${targetYear}-${targetMonth}-${parseInt(day)}`] = bestShift;
          }

          const count = Object.keys(schedule).length;
          if (!count) throw new Error(`辨識到文字但無法穩定對應日期，請改用「文字輸入」或調整圖片。`);
          setStatus('preview');
          setPreviewData({ schedule, isOnlyOff, count });
        } catch (err) {
          setStatus('error');
          setStatusMsg(err.message);
        }
      }

      return (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
          <div
            className="bg-white rounded-2xl shadow-2xl w-full max-w-md flex flex-col gap-4 p-6 max-h-[90vh] overflow-y-auto"
            onClick={e => e.stopPropagation()}
            onPaste={handlePaste}
          >
            {/* 標題列 */}
            <div className="flex items-center justify-between">
              <h2 className="text-lg font-bold text-gray-800">📥 匯入班表</h2>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
            </div>

            {/* 輸入模式切換 */}
            <div className="flex rounded-xl overflow-hidden border border-gray-200 text-sm font-semibold">
              {[['ocr','📸 圖片辨識'],['text','⌨️ 文字輸入']].map(([mode, label]) => (
                <button key={mode}
                  onClick={() => { setInputMode(mode); setStatus('idle'); setStatusMsg(''); setPreviewData(null); }}
                  className={`flex-1 py-2 transition-colors ${inputMode === mode ? 'bg-violet-500 text-white' : 'text-gray-500 hover:bg-gray-50'}`}>
                  {label}
                </button>
              ))}
            </div>

            {/* 月份（共用） */}
            <div className="flex gap-3">
              {inputMode === 'ocr' && (
                <div className="flex-1">
                  <label className="text-xs font-semibold text-gray-500 block mb-1">要擷取的人名</label>
                  <input
                    value={personName}
                    onChange={e => setPersonName(e.target.value)}
                    placeholder="例：宙斯"
                    className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400"
                  />
                </div>
              )}
              <div className={inputMode === 'ocr' ? 'w-28' : 'w-full'}>
                <label className="text-xs font-semibold text-gray-500 block mb-1">月份</label>
                <select
                  value={targetMonth}
                  onChange={e => setTargetMonth(Number(e.target.value))}
                  className="w-full border border-gray-200 rounded-lg px-2 py-2 text-sm outline-none focus:border-violet-400"
                >
                  {MONTHS.map((m, i) => (
                    <option key={i} value={i + 1}>{targetYear}/{i + 1}</option>
                  ))}
                </select>
              </div>
            </div>

            {inputMode === 'ocr' ? (<>
              {/* OCR 說明 */}
              <div className="bg-emerald-50 border border-emerald-200 rounded-xl px-3 py-2.5 flex items-start gap-2">
                <span className="text-emerald-600 mt-0.5">🖥️</span>
                <div className="text-xs text-gray-600 leading-relaxed">
                  <span className="font-semibold text-emerald-700">本機辨識，不需 API Key</span><br/>
                  首次使用會下載語言包（約 20MB）。圖片文字越清晰效果越好。
                </div>
              </div>

              {/* 圖片上傳區 */}
              <div
                onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                onDragLeave={() => setDragOver(false)}
                onDrop={handleDrop}
                onClick={() => fileRef.current?.click()}
                className={`relative rounded-xl border-2 border-dashed cursor-pointer transition-colors flex items-center justify-center overflow-hidden
                  ${dragOver ? 'border-violet-400 bg-violet-50' : 'border-gray-200 hover:border-violet-300 hover:bg-gray-50'}
                  ${imagePreview ? 'h-40' : 'h-32'}`}
              >
                <input ref={fileRef} type="file" accept="image/*" className="hidden"
                  onChange={e => handleFile(e.target.files[0])} />
                {imagePreview ? (
                  <img src={imagePreview} className="w-full h-full object-contain" alt="預覽" />
                ) : (
                  <div className="text-center text-gray-400 select-none">
                    <div className="text-3xl mb-1">🖼️</div>
                    <p className="text-sm">點擊上傳 / 拖曳 / Ctrl+V 貼上截圖</p>
                  </div>
                )}
              </div>

              {/* 除錯：顯示前處理後圖片 */}
              <label className="flex items-center gap-2 cursor-pointer select-none">
                <input type="checkbox" checked={showDebug} onChange={e => setShowDebug(e.target.checked)}
                  className="rounded" />
                <span className="text-xs text-gray-500">顯示 OCR 前處理後的圖片（除錯用）</span>
              </label>
              {showDebug && processedPreview && (
                <div className="rounded-xl border border-gray-200 overflow-hidden">
                  <p className="text-[10px] text-gray-400 px-2 pt-1">↓ Tesseract 實際看到的圖片（自適應二值化後）</p>
                  <img src={processedPreview} className="w-full object-contain max-h-40" alt="前處理預覽" />
                </div>
              )}
            </>) : (<>
              {/* 文字輸入說明 */}
              <div className="bg-sky-50 border border-sky-200 rounded-xl px-3 py-2 text-xs text-gray-600 space-y-1 leading-relaxed">
                <p className="font-semibold text-sky-700">支援以下格式：</p>
                <p>① <span className="font-mono bg-white px-1 rounded">早 中 休 晚 早 早 休…</span> 逐日序列</p>
                <p>② <span className="font-mono bg-white px-1 rounded">早中休晚早早休…</span> 連續單字（無空格）</p>
                <p>③ <span className="font-mono bg-white px-1 rounded">1早 2中 3休 4晚</span> 日期＋班別</p>
                <p>④ <span className="font-mono bg-white px-1 rounded">休 3 7 11 12 16</span> 只填休假日</p>
                <p className="text-gray-400">班別字元：早/白/A＝早班，中/B＝中班，晚/夜/C＝晚班，休/O/R＝休假</p>
              </div>
              <textarea
                value={textInput}
                onChange={e => setTextInput(e.target.value)}
                placeholder={'範例①：早 中 休 晚 早 早 休 中 晚 早 早 中 休 晚 早…\n範例④：休 3 7 11 12 16 17 24 25 26 30 31'}
                rows={5}
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm font-mono outline-none focus:border-violet-400 resize-none leading-relaxed"
              />
            </>)}

            {/* 狀態訊息 */}
            {statusMsg && status !== 'preview' && (
              <div className={`text-sm px-3 py-2 rounded-lg whitespace-pre-wrap break-words ${
                status === 'error'   ? 'bg-red-50 text-red-600'       :
                status === 'success' ? 'bg-emerald-50 text-emerald-700' :
                'bg-sky-50 text-sky-600'}`}>
                {status === 'loading' && <span className="inline-block animate-spin mr-1">⏳</span>}
                {statusMsg}
              </div>
            )}

            {/* OCR 預覽確認（可點擊微調）*/}
            {status === 'preview' && previewData && (() => {
              const { schedule, isOnlyOff, count } = previewData;
              const dim = new Date(targetYear, targetMonth, 0).getDate();
              const CYCLE = [null, 'off', 'morning', 'mid', 'night'];

              const setDay = (day, shift) => {
                setPreviewData(pd => {
                  const sched = { ...pd.schedule };
                  const k = `${targetYear}-${targetMonth}-${day}`;
                  if (shift === null) delete sched[k]; else sched[k] = shift;
                  return { ...pd, schedule: sched, count: Object.keys(sched).length };
                });
              };
              const cycleDay = (day, cur) => {
                const next = CYCLE[(CYCLE.indexOf(cur) + 1) % CYCLE.length];
                setDay(day, next);
              };

              return (
                <div className="rounded-xl border border-violet-200 bg-violet-50 p-3 space-y-2">
                  <p className="text-xs font-semibold text-violet-700">
                    {isOnlyOff
                      ? `⚠️ 顏色班表，辨識到 ${count} 個休假日`
                      : `✅ 解析到 ${count} 天`}
                    <span className="text-violet-400 font-normal"> · 點格子可修正</span>
                  </p>
                  <div className="grid grid-cols-7 gap-1 max-h-52 overflow-y-auto">
                    {Array.from({ length: dim }, (_, i) => i + 1).map(day => {
                      const shift = schedule[`${targetYear}-${targetMonth}-${day}`] || null;
                      const c = shift ? SHIFT_COLORS[shift] : null;
                      return (
                        <button key={day}
                          onClick={() => cycleDay(day, shift)}
                          className={`flex flex-col items-center justify-center rounded-md py-1 border text-[11px] leading-tight transition-colors
                            ${c ? `${c.bg} ${c.text} ${c.border}` : 'bg-white text-gray-300 border-gray-100 hover:border-violet-200'}`}>
                          <span className="font-bold">{day}</span>
                          <span className="text-[9px]">{shift ? SHIFT_LABELS[shift] : '—'}</span>
                        </button>
                      );
                    })}
                  </div>
                  <p className="text-[10px] text-violet-400">
                    每格循環：空 → 休 → 早 → 中 → 晚
                  </p>
                </div>
              );
            })()}

            {/* 按鈕 */}
            <div className="flex gap-3">
              <button onClick={onClose}
                className="flex-1 py-2 rounded-xl border border-gray-200 text-sm text-gray-600 hover:bg-gray-50">
                取消
              </button>
              {status === 'preview' ? (
                <>
                  <button onClick={() => { setStatus('idle'); setPreviewData(null); }}
                    className="flex-1 py-2 rounded-xl border border-gray-300 text-sm text-gray-600 hover:bg-gray-50">
                    重新{inputMode === 'ocr' ? '辨識' : '輸入'}
                  </button>
                  <button onClick={() => onImport(previewData.schedule, targetYear, targetMonth - 1)}
                    className="flex-1 py-2 rounded-xl bg-emerald-500 text-white text-sm font-semibold hover:bg-emerald-600">
                    確認匯入
                  </button>
                </>
              ) : inputMode === 'ocr' ? (
                <button onClick={runOCR} disabled={status === 'loading'}
                  className="flex-1 py-2 rounded-xl bg-violet-500 text-white text-sm font-semibold hover:bg-violet-600 disabled:opacity-50">
                  {status === 'loading' ? '辨識中...' : '辨識並匯入'}
                </button>
              ) : (
                <button onClick={runTextImport}
                  className="flex-1 py-2 rounded-xl bg-violet-500 text-white text-sm font-semibold hover:bg-violet-600">
                  解析並預覽
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ── Telegram 通知 Modal ──────────────────────────────────────────
    function TgModal({ onClose, selectedDates, year, month, selfId }) {
      const [botToken, setBotToken] = useState(() => localStorage.getItem('tg_bot_token') || '');
      const [showGuide, setShowGuide] = useState(false);
      const [selected, setSelected]   = useState(new Set(DEFAULT_RECIPIENTS.filter(r => r.id !== selfId).map(r => r.id)));
      const [results, setResults]     = useState({});
      const [sending, setSending]     = useState(false);

      const sortedDays = [...selectedDates].map(k => parseInt(k.split('-')[1])).sort((a, b) => a - b);
      const WEEKDAY_NAMES = ['日','一','二','三','四','五','六'];

      function dayLabel(day) {
        const d = new Date(year, month, day);
        return `${month + 1}月${day}日（週${WEEKDAY_NAMES[d.getDay()]}）`;
      }

      function toggleRecipient(id) {
        setSelected(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id); else next.add(id);
          return next;
        });
      }

      async function sendAll() {
        if (!botToken.trim() || selected.size === 0) return;
        localStorage.setItem('tg_bot_token', botToken.trim());
        setSending(true);
        setResults({});

        const lines = sortedDays.map(d => `• ${dayLabel(d)}`).join('\n');
        const text  = `📅 共同排休通知\n\n以下日期建議大家一起排休：\n${lines}\n\n請盡量安排這幾天的休假 🙏`;

        for (const r of DEFAULT_RECIPIENTS.filter(r => selected.has(r.id))) {
          try {
            const res  = await fetch(`https://api.telegram.org/bot${botToken.trim()}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ chat_id: r.id, text }),
            });
            const data = await res.json();
            setResults(prev => ({ ...prev, [r.id]: data.ok ? 'ok' : (data.description || 'error') }));
          } catch (err) {
            setResults(prev => ({ ...prev, [r.id]: err.message }));
          }
        }
        setSending(false);
      }

      return (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md flex flex-col gap-4 p-6 max-h-[90vh] overflow-y-auto"
            onClick={e => e.stopPropagation()}>

            <div className="flex items-center justify-between">
              <h2 className="text-lg font-bold text-gray-800">📣 發送排休通知</h2>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
            </div>

            <div className="bg-gray-50 rounded-xl p-3 border border-gray-100">
              <p className="text-xs font-semibold text-gray-400 mb-2">訊息預覽</p>
              <p className="text-sm text-gray-700 whitespace-pre-line leading-relaxed">
                {`📅 共同排休通知\n\n以下日期建議大家一起排休：\n${sortedDays.map(d => `• ${dayLabel(d)}`).join('\n')}\n\n請盡量安排這幾天的休假 🙏`}
              </p>
            </div>

            <div>
              <label className="text-xs font-semibold text-gray-500 block mb-2">選擇通知對象</label>
              <div className="space-y-1.5">
                {DEFAULT_RECIPIENTS.map(r => {
                  const res = results[r.id];
                  if (r.id === selfId) return (
                    <div key={r.id} className="flex items-center gap-3 px-3 py-2 rounded-xl border border-gray-100 bg-gray-50 opacity-60">
                      <span className="w-4 h-4 flex items-center justify-center text-gray-400 text-xs">—</span>
                      <span className="text-sm font-medium text-gray-500 flex-1">{r.name}</span>
                      <span className="text-xs text-gray-400 bg-gray-200 px-1.5 py-0.5 rounded-full">發起人</span>
                    </div>
                  );
                  return (
                    <label key={r.id}
                      className={`flex items-center gap-3 px-3 py-2 rounded-xl border cursor-pointer transition-colors
                        ${selected.has(r.id) ? 'bg-sky-50 border-sky-200' : 'bg-gray-50 border-gray-100'}`}>
                      <input type="checkbox" checked={selected.has(r.id)}
                        onChange={() => toggleRecipient(r.id)}
                        className="accent-sky-500 w-4 h-4" />
                      <span className="text-sm font-medium text-gray-700 flex-1">{r.name}</span>
                      {res === 'ok'    && <span className="text-xs text-emerald-600 font-semibold">✓ 已送達</span>}
                      {res && res !== 'ok' && <span className="text-xs text-red-500">{res}</span>}
                      {sending && selected.has(r.id) && !res && (
                        <span className="text-xs text-gray-400 animate-pulse">發送中...</span>
                      )}
                    </label>
                  );
                })}
              </div>
            </div>

            <div>
              <div className="flex items-center justify-between mb-1">
                <label className="text-xs font-semibold text-gray-500">Bot Token</label>
                <button onClick={() => setShowGuide(g => !g)}
                  className="text-xs text-violet-500 hover:text-violet-700 font-medium">
                  {showGuide ? '收起 ▲' : '如何更換？▼'}
                </button>
              </div>
              <input type="password" value={botToken} onChange={e => setBotToken(e.target.value)}
                placeholder="123456789:AAF..."
                className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
              {showGuide && (
                <div className="mt-2 bg-violet-50 border border-violet-100 rounded-xl p-3 space-y-1.5">
                  {['在 Telegram 搜尋 @BotFather','傳送 /newbot 建立機器人','取得 Token 後貼到上方'].map((s, i) => (
                    <div key={i} className="flex gap-2 text-xs text-gray-600">
                      <span className="w-4 h-4 rounded-full bg-violet-200 text-violet-700 font-bold flex-shrink-0 flex items-center justify-center text-[10px]">{i+1}</span>
                      <span>{s}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="flex gap-3">
              <button onClick={onClose}
                className="flex-1 py-2 rounded-xl border border-gray-200 text-sm text-gray-600 hover:bg-gray-50">
                關閉
              </button>
              <button onClick={sendAll} disabled={sending || selected.size === 0}
                className="flex-1 py-2 rounded-xl bg-sky-500 text-white text-sm font-semibold hover:bg-sky-600 disabled:opacity-50">
                {sending ? '發送中...' : `發送給 ${selected.size} 人`}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── 跨人總覽 Modal ───────────────────────────────────────────────
    function DayOverviewModal({ day, year, month, schedules, onClose }) {
      const WEEKDAY_NAMES = ['日','一','二','三','四','五','六'];
      const date = new Date(year, month, day);
      const weekday = WEEKDAY_NAMES[date.getDay()];
      const key = `${year}-${month + 1}-${day}`;
      return (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-xs p-5 space-y-3" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between">
              <h3 className="text-base font-bold text-gray-800">
                {month + 1} 月 {day} 日（週{weekday}）
              </h3>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-lg">✕</button>
            </div>
            <div className="space-y-2">
              {DEFAULT_RECIPIENTS.map((r, idx) => {
                const shift = (schedules[r.id] || {})[key] || null;
                const style = MEMBER_STYLES[idx] ?? MEMBER_STYLES[0];
                const c = shift ? SHIFT_COLORS[shift] : null;
                return (
                  <div key={r.id} className={`flex items-center justify-between px-3 py-2 rounded-xl border ${c ? c.bg + ' ' + c.border : 'bg-gray-50 border-gray-100'}`}>
                    <div className="flex items-center gap-2">
                      <div className={`w-7 h-7 rounded-full ${style.color}${style.avatarImg ? ' overflow-hidden' : ''} flex items-center justify-center text-sm shadow-sm flex-shrink-0`}>
                        {style.avatarImg
                          ? <img src={style.avatarImg} alt="" className="w-full h-full object-cover" onError={e => e.target.style.display='none'} />
                          : style.avatar}
                      </div>
                      <span className="text-sm font-semibold text-gray-700">{r.name}</span>
                    </div>
                    {shift
                      ? <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${c.text}`}>{SHIFT_LABELS[shift]}</span>
                      : <span className="text-xs text-gray-300">—</span>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ── 主元件 ───────────────────────────────────────────────────────
    function App() {
      const today = new Date();
      const [year,  setYear]  = useState(today.getFullYear());
      const [month, setMonth] = useState(today.getMonth());

      // selfId = 我是誰（決定編輯權限 + TG 發起人）
      const [selfId, setSelfId] = useState(() => localStorage.getItem('self_id') || '1023527456');
      // selectedId = 目前檢視哪位成員的班表（預設看自己）
      const [selectedId, setSelectedId] = useState(() => localStorage.getItem('self_id') || '1023527456');

      // 各成員班表，以 TG ID 為 key（優先讀 localStorage，否則用預設 demo 資料）
      const [schedules, setSchedules] = useState(() => LS.get('schedules', {
        '747743302':  makeSchedule(2),
        '1023527456': {},
        '1327870155': makeSchedule(4),
        '1343561806': makeSchedule(6),
      }));

      // 自訂暱稱（覆蓋 DEFAULT_RECIPIENTS 預設名）
      const [names,     setNames]     = useState(() => LS.get('names', {}));
      const [editingId, setEditingId] = useState(null);
      const [editValue, setEditValue] = useState('');

      const [showImport,    setShowImport]    = useState(false);
      const [sharedOffMode, setSharedOffMode] = useState(false);
      const [sharedOffDates,setSharedOffDates]= useState(() => new Set(LS.get('sharedOffDates', [])));
      const [showTgModal,   setShowTgModal]   = useState(false);
      const [overviewDay,   setOverviewDay]   = useState(null); // 跨人總覽
      const [sidebarOpen,   setSidebarOpen]   = useState(false); // 手機抽屜

      // ── 本機自動存檔（離線快取）──
      useEffect(() => { LS.set('schedules', schedules); }, [schedules]);
      useEffect(() => { LS.set('names', names); }, [names]);
      useEffect(() => { LS.set('sharedOffDates', [...sharedOffDates]); }, [sharedOffDates]);

      // ── 雲端同步（Supabase）──
      // 'local'=未連線只用本機 / 'syncing'=連線中 / 'synced'=已同步
      const [syncStatus, setSyncStatus] = useState('local');
      const supaRef        = useRef(null);
      const applyingRemote = useRef(false); // 正在套用雲端資料時，抑制回寫
      const cloudLoaded    = useRef(false); // 首次雲端載入完成前不回寫
      const writeTimer     = useRef(null);

      // 把雲端資料套進本機 state
      function applyRemote(d) {
        if (!d) return;
        applyingRemote.current = true;
        if (d.schedules) setSchedules(d.schedules);
        if (d.names)     setNames(d.names);
        if (Array.isArray(d.sharedOffDates)) setSharedOffDates(new Set(d.sharedOffDates));
        setTimeout(() => { applyingRemote.current = false; }, 60);
      }

      // 啟動：建立連線 → 載入雲端資料 → 訂閱即時更新
      useEffect(() => {
        const sb = makeSupabase();
        if (!sb) { setSyncStatus('local'); return; }
        supaRef.current = sb;
        setSyncStatus('syncing');

        (async () => {
          try {
            const { data } = await sb.from('shared_state').select('data')
              .eq('id', SYNC_ROW_ID).maybeSingle();
            const cloud = data && data.data;
            if (cloud && Object.keys(cloud).length) {
              applyRemote(cloud);                       // 雲端有資料 → 以雲端為準
            } else {
              // 雲端是空的 → 用目前本機資料當基準種子上去
              const seed = { schedules, names, sharedOffDates: [...sharedOffDates] };
              await sb.from('shared_state')
                .update({ data: seed, updated_at: new Date().toISOString() })
                .eq('id', SYNC_ROW_ID);
            }
          } catch (e) { console.warn('雲端載入失敗', e); }
          cloudLoaded.current = true;
          setSyncStatus('synced');
        })();

        const ch = sb.channel('shared_state_main')
          .on('postgres_changes',
            { event: '*', schema: 'public', table: 'shared_state', filter: `id=eq.${SYNC_ROW_ID}` },
            payload => { if (payload.new && payload.new.data) applyRemote(payload.new.data); })
          .subscribe();

        return () => { try { sb.removeChannel(ch); } catch {} };
      }, []);

      // 本機資料變動 → 防抖回寫雲端（套用遠端時不回寫）
      useEffect(() => {
        if (!supaRef.current || !cloudLoaded.current || applyingRemote.current) return;
        clearTimeout(writeTimer.current);
        const snapshot = { schedules, names, sharedOffDates: [...sharedOffDates] };
        writeTimer.current = setTimeout(async () => {
          try {
            await supaRef.current.from('shared_state')
              .update({ data: snapshot, updated_at: new Date().toISOString() })
              .eq('id', SYNC_ROW_ID);
          } catch (e) { console.warn('雲端寫入失敗', e); }
        }, 600);
      }, [schedules, names, sharedOffDates]);

      // 取得顯示名稱（優先用自訂暱稱，否則 DEFAULT_RECIPIENTS 預設）
      function getName(id) {
        return names[id] ?? DEFAULT_RECIPIENTS.find(r => r.id === id)?.name ?? id;
      }

      // 切換身份（同時切換檢視到自己）
      function handleSetSelf(id) {
        setSelfId(id);
        setSelectedId(id);
        localStorage.setItem('self_id', id);
      }

      function selectMember(id) {
        setSelectedId(id);
        setSidebarOpen(false); // 手機選完自動收起
      }

      function prevMonth() {
        if (month === 0) { setMonth(11); setYear(y => y - 1); } else setMonth(m => m - 1);
      }
      function nextMonth() {
        if (month === 11) { setMonth(0);  setYear(y => y + 1); } else setMonth(m => m + 1);
      }

      function startEdit(id, e) {
        e.stopPropagation();
        setEditingId(id);
        setEditValue(getName(id));
      }

      function commitEdit() {
        if (editingId && editValue.trim())
          setNames(prev => ({ ...prev, [editingId]: editValue.trim() }));
        setEditingId(null);
      }

      function toggleSharedOff(day) {
        const key = dateKey(year, month, day);
        setSharedOffDates(prev => {
          const next = new Set(prev);
          if (next.has(key)) next.delete(key); else next.add(key);
          return next;
        });
      }

      function cycleShift(day) {
        if (selectedId !== selfId) return;   // 只能編輯自己的班表
        const key     = dateKey(year, month, day);
        const current = (schedules[selfId] || {})[key] || null;
        const idx     = SHIFT_TYPES.indexOf(current);
        const next    = SHIFT_TYPES[(idx + 1) % SHIFT_TYPES.length];
        setSchedules(prev => {
          const mine = { ...(prev[selfId] || {}) };
          if (next === null) delete mine[key]; else mine[key] = next;
          return { ...prev, [selfId]: mine };
        });
      }

      function handleImport(importedSchedule, importYear, importMonth) {
        setSchedules(prev => ({
          ...prev,
          [selfId]: { ...(prev[selfId] || {}), ...importedSchedule },
        }));
        setYear(importYear);
        setMonth(importMonth);
        setSelectedId(selfId);
        setTimeout(() => setShowImport(false), 800);
      }

      // 目前檢視的班表與樣式
      const schedule     = schedules[selectedId] || {};
      const selectedIdx  = DEFAULT_RECIPIENTS.findIndex(r => r.id === selectedId);
      const currentStyle = MEMBER_STYLES[selectedIdx] ?? MEMBER_STYLES[0];
      const isEditable   = selectedId === selfId;
      const rawCellImages = MEMBER_THEMES[selectedId]?.cellImages || null;
      // Seeded shuffle 圖庫，讓每個人的排列不同但每次重載一致
      const cellCombos = useMemo(() => {
        if (!rawCellImages) return null;
        const seed = parseInt(selectedId, 10) >>> 0;
        return buildCellCombos(rawCellImages, seed);
      }, [selectedId]);

      const daysInMonth = getDaysInMonth(year, month);
      const firstDay    = getFirstDayOfWeek(year, month);

      const isToday = (d) =>
        d === today.getDate() && month === today.getMonth() && year === today.getFullYear();

      const shiftCounts = useMemo(() => {
        const counts = { morning: 0, mid: 0, night: 0, off: 0 };
        const prefix = `${year}-${month + 1}-`;
        Object.entries(schedule).forEach(([k, v]) => {
          if (k.startsWith(prefix) && counts[v] !== undefined) counts[v]++;
        });
        return counts;
      }, [schedule, year, month]);

      // 當月休假日列表（升序）
      const offDaysList = useMemo(() => {
        const prefix = `${year}-${month + 1}-`;
        return Object.entries(schedule)
          .filter(([k, v]) => k.startsWith(prefix) && v === 'off')
          .map(([k]) => parseInt(k.slice(prefix.length)))
          .sort((a, b) => a - b);
      }, [schedule, year, month]);

      // 共同可休：當月「所有有排班的成員」都休假的日子
      const commonOffDays = useMemo(() => {
        const prefix = `${year}-${month + 1}-`;
        const dim = getDaysInMonth(year, month);
        // 只計入「該月有資料」的成員（完全空白的人不影響判斷）
        const activeMembers = DEFAULT_RECIPIENTS
          .map(r => schedules[r.id] || {})
          .filter(s => Object.keys(s).some(k => k.startsWith(prefix)));
        if (activeMembers.length < 2) return new Set();
        const result = new Set();
        for (let d = 1; d <= dim; d++) {
          const key = `${prefix}${d}`;
          if (activeMembers.every(s => s[key] === 'off')) result.add(d);
        }
        return result;
      }, [schedules, year, month]);

      // ── 批次編輯（只能編輯自己）──
      function clearMonth() {
        if (selectedId !== selfId) return;
        if (!window.confirm(`確定清空 ${year}/${month + 1} 整月的班表？`)) return;
        const prefix = `${year}-${month + 1}-`;
        setSchedules(prev => {
          const mine = { ...(prev[selfId] || {}) };
          Object.keys(mine).forEach(k => { if (k.startsWith(prefix)) delete mine[k]; });
          return { ...prev, [selfId]: mine };
        });
      }

      function fillMonth(shift) {
        if (selectedId !== selfId) return;
        const prefix = `${year}-${month + 1}-`;
        const dim = getDaysInMonth(year, month);
        setSchedules(prev => {
          const mine = { ...(prev[selfId] || {}) };
          for (let d = 1; d <= dim; d++) {
            if (shift === null) delete mine[`${prefix}${d}`];
            else mine[`${prefix}${d}`] = shift;
          }
          return { ...prev, [selfId]: mine };
        });
      }

      const cells = [];
      for (let i = 0; i < firstDay; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);

      return (
        <div className="flex h-screen bg-gray-50 overflow-hidden">

          {showImport && (
            <ImportModal
              onClose={() => setShowImport(false)}
              onImport={handleImport}
              defaultYear={year}
              defaultMonth={month}
            />
          )}

          {showTgModal && (
            <TgModal
              onClose={() => setShowTgModal(false)}
              selectedDates={sharedOffDates}
              year={year}
              month={month}
              selfId={selfId}
            />
          )}

          {overviewDay && (
            <DayOverviewModal
              day={overviewDay}
              year={year}
              month={month}
              schedules={schedules}
              onClose={() => setOverviewDay(null)}
            />
          )}

          {/* 手機抽屜遮罩 */}
          {sidebarOpen && (
            <div className="fixed inset-0 bg-black/40 z-30 md:hidden"
              onClick={() => setSidebarOpen(false)} />
          )}

          {/* ── 左側列表（桌面固定 / 手機抽屜）─────────────────────── */}
          <aside className={`bg-white border-r border-gray-200 flex flex-col shadow-sm
            w-64 flex-shrink-0
            max-md:fixed max-md:inset-y-0 max-md:left-0 max-md:z-40 max-md:transition-transform
            ${sidebarOpen ? 'max-md:translate-x-0' : 'max-md:-translate-x-full'}`}>

            <div className="p-5 border-b border-gray-100 flex items-center justify-between">
              <div>
                <h1 className="text-lg font-bold text-gray-800 tracking-tight">好友班表</h1>
                <div className="flex items-center gap-1.5 mt-0.5">
                  {syncStatus === 'synced' ? (
                    <><span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                      <span className="text-xs text-emerald-500">雲端已同步</span></>
                  ) : syncStatus === 'syncing' ? (
                    <><span className="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                      <span className="text-xs text-amber-500">連線中…</span></>
                  ) : (
                    <><span className="w-1.5 h-1.5 rounded-full bg-gray-300"></span>
                      <span className="text-xs text-gray-400">僅本機</span></>
                  )}
                </div>
              </div>
              <button onClick={() => setSidebarOpen(false)}
                className="md:hidden text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
            </div>

            {/* 成員列表 */}
            <div className="flex-1 overflow-y-auto p-3 space-y-2">
              {DEFAULT_RECIPIENTS.map((r, idx) => {
                const memberStyle = MEMBER_STYLES[idx] ?? MEMBER_STYLES[0];
                const theme       = MEMBER_THEMES[r.id];
                const isActive    = selectedId === r.id;
                const isSelf      = selfId === r.id;
                const isEditing   = editingId === r.id;

                /* ── 有主題：垂直 banner 卡片 ── */
                if (theme) return (
                  <div
                    key={r.id}
                    onClick={() => selectMember(r.id)}
                    className={`friend-item rounded-xl overflow-hidden cursor-pointer transition-all
                      ${isActive ? 'ring-2 ring-violet-400 shadow-md' : 'hover:shadow-sm'}`}
                  >
                    {/* Banner（漸層背景 + 裝飾元素）*/}
                    <div className="relative px-3 pt-3 pb-2.5 overflow-hidden"
                      style={{ background: theme.banner }}>
                      {/* 裝飾 emoji */}
                      {theme.deco.map((d, i) => (
                        <span key={i} className="absolute pointer-events-none select-none"
                          style={{ ...d.style, ...(d.color ? { color: d.color } : {}) }}>
                          {d.emoji}
                        </span>
                      ))}
                      {/* 頭像 + 名稱 */}
                      <div className="relative z-10 flex items-center gap-2.5">
                        <div className={`w-10 h-10 rounded-full ${memberStyle.color}${memberStyle.avatarImg ? ' overflow-hidden' : ''} flex items-center justify-center text-xl shadow-lg flex-shrink-0 relative border-2 border-white/30`}>
                          {memberStyle.avatarImg
                            ? <img src={memberStyle.avatarImg} alt="" className="w-full h-full object-cover" onError={e => e.target.style.display='none'} />
                            : memberStyle.avatar}
                          {isSelf && (
                            <span className="absolute -bottom-0.5 -right-0.5 w-4 h-4 bg-violet-600 text-white text-[9px] font-bold rounded-full flex items-center justify-center leading-none shadow">
                              我
                            </span>
                          )}
                        </div>
                        <div className="flex-1 min-w-0">
                          {isEditing ? (
                            <input autoFocus value={editValue}
                              onChange={e => setEditValue(e.target.value)}
                              onBlur={commitEdit}
                              onKeyDown={e => { if (e.key==='Enter') commitEdit(); if (e.key==='Escape') setEditingId(null); }}
                              onClick={e => e.stopPropagation()}
                              className="w-full text-sm font-bold bg-white/20 border border-white/40 rounded px-1 outline-none"
                              style={{ color: theme.nameColor }}
                            />
                          ) : (
                            <p className="text-sm font-bold truncate drop-shadow"
                              style={{ color: theme.nameColor }}>
                              {getName(r.id)}
                            </p>
                          )}
                        </div>
                      </div>
                    </div>
                    {/* 底部工具列 */}
                    <div className="flex items-center gap-1 px-3 py-1.5 bg-black/5 border-t border-white/10">
                      {isSelf && (
                        <span className="text-[10px] mr-auto" style={{ color: theme.subColor }}>
                          {isActive ? '✏ 點日期可編輯' : '我的帳號'}
                        </span>
                      )}
                      {!isSelf && !isEditing && (
                        <button
                          onClick={e => { e.stopPropagation(); handleSetSelf(r.id); }}
                          className="text-[10px] font-semibold mr-auto px-1.5 py-0.5 rounded-full bg-white/10 hover:bg-white/25 transition-colors"
                          style={{ color: theme.labelColor }}
                        >設為我</button>
                      )}
                      <button onClick={e => startEdit(r.id, e)}
                        className="text-[11px] px-1.5 opacity-40 hover:opacity-80 transition-opacity"
                        style={{ color: theme.nameColor }}>✎</button>
                    </div>
                  </div>
                );

                /* ── 無主題：原本的平面卡片 ── */
                return (
                  <div
                    key={r.id}
                    onClick={() => selectMember(r.id)}
                    className={`friend-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl cursor-pointer
                      ${isActive
                        ? 'bg-violet-50 border border-violet-200'
                        : 'hover:bg-gray-50 border border-transparent'}`}
                  >
                    <div className={`w-9 h-9 rounded-full ${memberStyle.color}${memberStyle.avatarImg ? ' overflow-hidden' : ''} flex items-center justify-center text-lg shadow-sm flex-shrink-0 relative`}>
                      {memberStyle.avatarImg
                        ? <img src={memberStyle.avatarImg} alt="" className="w-full h-full object-cover" onError={e => e.target.style.display='none'} />
                        : memberStyle.avatar}
                      {isSelf && (
                        <span className="absolute -bottom-0.5 -right-0.5 w-4 h-4 bg-violet-600 text-white text-[9px] font-bold rounded-full flex items-center justify-center leading-none shadow">
                          我
                        </span>
                      )}
                    </div>
                    <div className="flex-1 min-w-0">
                      {isEditing ? (
                        <input autoFocus value={editValue}
                          onChange={e => setEditValue(e.target.value)}
                          onBlur={commitEdit}
                          onKeyDown={e => { if (e.key==='Enter') commitEdit(); if (e.key==='Escape') setEditingId(null); }}
                          onClick={e => e.stopPropagation()}
                          className="w-full text-sm font-semibold text-violet-700 bg-white border border-violet-300 rounded px-1 outline-none"
                        />
                      ) : (
                        <p className={`text-sm font-semibold truncate ${isActive ? 'text-violet-700' : 'text-gray-700'}`}>
                          {getName(r.id)}
                        </p>
                      )}
                      {isSelf && !isEditing && (
                        <p className="text-xs text-violet-400">{isActive ? '點日期可編輯' : '我的帳號'}</p>
                      )}
                    </div>
                    {!isEditing && (
                      <div className="flex items-center gap-1 flex-shrink-0">
                        <button onClick={e => startEdit(r.id, e)}
                          className="text-gray-300 hover:text-gray-500 text-xs px-1" title="改名">✎</button>
                        {!isSelf && (
                          <button onClick={e => { e.stopPropagation(); handleSetSelf(r.id); }}
                            className="text-[10px] text-gray-300 hover:text-violet-500 font-semibold px-1 leading-none"
                            title="設為我">設為我</button>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* 匯入按鈕 + 備份 + 班別說明 */}
            <div className="p-4 border-t border-gray-100 space-y-3">
              <button
                onClick={() => setShowImport(true)}
                className="w-full flex items-center justify-center gap-2 py-2 rounded-xl bg-violet-50 border border-violet-200 text-violet-600 text-sm font-semibold hover:bg-violet-100 transition-colors"
              >
                📸 匯入班表圖片
              </button>
              <div className="flex gap-2">
                <button
                  onClick={() => {
                    const data = JSON.stringify({ schedules, names, sharedOffDates: [...sharedOffDates] }, null, 2);
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
                    a.download = `班表備份_${new Date().toISOString().slice(0,10)}.json`;
                    a.click();
                  }}
                  className="flex-1 flex items-center justify-center gap-1 py-1.5 rounded-lg bg-gray-50 border border-gray-200 text-gray-500 text-xs font-semibold hover:bg-gray-100 transition-colors"
                  title="匯出備份 JSON">
                  ⬇ 備份
                </button>
                <label className="flex-1 flex items-center justify-center gap-1 py-1.5 rounded-lg bg-gray-50 border border-gray-200 text-gray-500 text-xs font-semibold hover:bg-gray-100 transition-colors cursor-pointer" title="從備份 JSON 還原">
                  ⬆ 還原
                  <input type="file" accept=".json" className="hidden" onChange={e => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = ev => {
                      try {
                        const d = JSON.parse(ev.target.result);
                        if (d.schedules) setSchedules(d.schedules);
                        if (d.names)     setNames(d.names);
                        if (d.sharedOffDates) setSharedOffDates(new Set(d.sharedOffDates));
                        alert('還原成功！');
                      } catch { alert('檔案格式錯誤'); }
                    };
                    reader.readAsText(file);
                    e.target.value = '';
                  }} />
                </label>
              </div>
              <div className="space-y-1.5">
                <p className="text-xs font-semibold text-gray-400 uppercase tracking-wider">班別說明</p>
                {Object.entries(SHIFT_COLORS).map(([key, c]) => (
                  <div key={key} className="flex items-center gap-2">
                    <div className={`w-3 h-3 rounded-full ${c.dot}`}></div>
                    <span className="text-xs text-gray-600">{SHIFT_LABELS[key]}</span>
                  </div>
                ))}
              </div>
            </div>
          </aside>

          {/* ── 主要內容 ─────────────────────────────────────────── */}
          <main className="flex-1 flex flex-col overflow-auto">

            {/* 標題區 */}
            {(() => {
              const theme = MEMBER_THEMES[selectedId];
              if (theme) {
                return (
                  <div className="relative overflow-hidden flex-shrink-0"
                    style={{ background: theme.headerBanner, minHeight: '96px' }}>
                    {theme.headerDeco.map((d, i) => (
                      <span key={i} className="absolute pointer-events-none select-none"
                        style={{ ...d.style, ...(d.color ? { color: d.color } : {}) }}>
                        {d.emoji}
                      </span>
                    ))}
                    <div className="relative z-10 flex items-center justify-between gap-2 flex-wrap px-4 md:px-6 py-4">
                      <div className="flex items-center gap-4">
                        <button onClick={() => setSidebarOpen(true)}
                          className="md:hidden p-2 -ml-2 rounded-lg text-2xl leading-none"
                          style={{ color: theme.nameColor }} title="成員清單">☰</button>
                        <div className={`w-14 h-14 rounded-full ${currentStyle.color}${currentStyle.avatarImg ? ' overflow-hidden' : ''} flex items-center justify-center text-3xl shadow-xl border-2 border-white/25 flex-shrink-0`}>
                          {currentStyle.avatarImg
                            ? <img src={currentStyle.avatarImg} alt="" className="w-full h-full object-cover" onError={e => e.target.style.display='none'} />
                            : currentStyle.avatar}
                        </div>
                        <div>
                          <div className="flex items-center gap-2">
                            <h2 className="text-2xl font-black drop-shadow" style={{ color: theme.nameColor }}>
                              {getName(selectedId)} 的班表
                            </h2>
                            {isEditable && (
                              <span className="text-[10px] font-bold px-2 py-0.5 rounded-full border"
                                style={{ color: theme.labelColor, borderColor: theme.labelColor + '60', background: theme.labelColor + '20' }}>
                                我的
                              </span>
                            )}
                          </div>
                          <p className="text-xs mt-0.5 opacity-70" style={{ color: theme.nameColor }}>
                            {year} 年 {MONTHS[month]} 月{isEditable && ' · 點擊日期切換班別'}
                          </p>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <button onClick={() => setSharedOffMode(m => !m)}
                          className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-semibold border transition-colors
                            ${sharedOffMode ? theme.sharedOffActiveStyle : theme.sharedOffStyle}`}>
                          🌴 {sharedOffMode ? '結束選擇' : '共同排休'}
                        </button>
                        <button onClick={prevMonth}
                          className={`p-2 rounded-lg border transition-colors ${theme.controlBg}`}>‹</button>
                        <span className="text-sm font-bold w-24 text-center drop-shadow"
                          style={{ color: theme.nameColor }}>
                          {year} / {String(month + 1).padStart(2, '0')}
                        </span>
                        <button onClick={nextMonth}
                          className={`p-2 rounded-lg border transition-colors ${theme.controlBg}`}>›</button>
                        {(year !== today.getFullYear() || month !== today.getMonth()) && (
                          <button onClick={() => { setYear(today.getFullYear()); setMonth(today.getMonth()); }}
                            className={`px-2 py-1 rounded-lg border text-xs font-semibold transition-colors ${theme.controlBg}`}
                            title="回到本月">今月</button>
                        )}
                      </div>
                    </div>
                  </div>
                );
              }
              return (
                <div className="flex items-center justify-between gap-2 flex-wrap px-4 md:px-6 py-4 md:py-5 flex-shrink-0">
                  <div className="flex items-center gap-3">
                    <button onClick={() => setSidebarOpen(true)}
                      className="md:hidden p-2 -ml-2 rounded-lg text-2xl leading-none text-gray-500 hover:bg-gray-100"
                      title="成員清單">☰</button>
                    <div className={`w-10 h-10 rounded-full ${currentStyle.color}${currentStyle.avatarImg ? ' overflow-hidden' : ''} flex items-center justify-center text-xl shadow`}>
                      {currentStyle.avatarImg
                        ? <img src={currentStyle.avatarImg} alt="" className="w-full h-full object-cover" onError={e => e.target.style.display='none'} />
                        : currentStyle.avatar}
                    </div>
                    <div>
                      <h2 className="text-xl font-bold text-gray-800">
                        {getName(selectedId)} 的班表
                        {isEditable && <span className="ml-2 text-xs font-medium text-violet-400 bg-violet-50 px-2 py-0.5 rounded-full">我的</span>}
                      </h2>
                      <p className="text-sm text-gray-400">
                        {year} 年 {MONTHS[month]} 月{isEditable && ' · 點擊日期切換班別'}
                      </p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => setSharedOffMode(m => !m)}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-semibold border transition-colors
                        ${sharedOffMode ? 'bg-rose-500 text-white border-rose-500' : 'bg-white text-rose-500 border-rose-300 hover:bg-rose-50'}`}>
                      🌴 {sharedOffMode ? '結束選擇' : '共同排休'}
                    </button>
                    <button onClick={prevMonth}
                      className="p-2 rounded-lg hover:bg-gray-100 text-gray-500 hover:text-gray-700 transition-colors">‹</button>
                    <span className="text-sm font-semibold text-gray-600 w-24 text-center">
                      {year} / {String(month + 1).padStart(2, '0')}

                    </span>
                    <button onClick={nextMonth}
                      className="p-2 rounded-lg hover:bg-gray-100 text-gray-500 hover:text-gray-700 transition-colors">›</button>
                    {(year !== today.getFullYear() || month !== today.getMonth()) && (
                      <button onClick={() => { setYear(today.getFullYear()); setMonth(today.getMonth()); }}
                        className="px-2 py-1 rounded-lg bg-violet-50 border border-violet-200 text-violet-500 text-xs font-semibold hover:bg-violet-100 transition-colors"
                        title="回到本月">今月</button>
                    )}
                  </div>
                </div>
              );
            })()}

            <div className="flex-1 flex flex-col p-3 md:p-6 pt-4 md:pt-5 overflow-auto">

            {/* 統計卡片 */}
            <div className="flex gap-3 mb-2">
              {Object.entries(shiftCounts).map(([key, count]) => {
                const c = SHIFT_COLORS[key];
                return (
                  <div key={key} className={`flex-1 rounded-xl p-3 ${c.bg} border ${c.border}`}>
                    <div className={`text-2xl font-bold ${c.text}`}>{count}</div>
                    <div className={`text-xs font-medium ${c.text} opacity-80`}>{SHIFT_LABELS[key]}</div>
                  </div>
                );
              })}
            </div>

            {/* 休假日說明 */}
            {offDaysList.length > 0 ? (
              <div className="flex items-center gap-1.5 mb-2 px-1">
                <div className="w-2 h-2 rounded-full bg-emerald-400 flex-shrink-0"></div>
                <span className="text-xs text-gray-500">
                  <span className="font-medium text-emerald-600">休假日：</span>
                  {offDaysList.map((d, i) => (
                    <span key={d}>{i > 0 && <span className="text-gray-300 mx-0.5">·</span>}{d} 日</span>
                  ))}
                </span>
              </div>
            ) : (
              <div className="mb-2" />
            )}

            {/* 共同可休提示 */}
            {commonOffDays.size > 0 && (
              <div className="flex items-center gap-2 mb-2 px-2.5 py-1.5 rounded-lg bg-amber-50 border border-amber-200">
                <span className="text-sm">✨</span>
                <span className="text-xs text-amber-700 flex-1">
                  <span className="font-semibold">大家都能休：</span>
                  {[...commonOffDays].sort((a,b)=>a-b).map((d, i) => (
                    <span key={d}>{i > 0 && <span className="text-amber-300 mx-0.5">·</span>}{d}日</span>
                  ))}
                </span>
                <button
                  onClick={() => setSharedOffDates(prev => {
                    const next = new Set(prev);
                    commonOffDays.forEach(d => next.add(dateKey(year, month, d)));
                    return next;
                  })}
                  className="text-[11px] font-semibold text-amber-700 bg-amber-100 hover:bg-amber-200 px-2 py-0.5 rounded-full transition-colors whitespace-nowrap">
                  🌴 加入排休
                </button>
              </div>
            )}

            {/* 批次編輯工具列（只在編輯自己時顯示）*/}
            {isEditable && (
              <div className="flex items-center gap-1.5 mb-3 px-1 flex-wrap">
                <span className="text-[11px] text-gray-400 mr-0.5">快速填整月：</span>
                {Object.entries(SHIFT_LABELS).map(([k, label]) => {
                  const c = SHIFT_COLORS[k];
                  return (
                    <button key={k} onClick={() => fillMonth(k)}
                      className={`text-[11px] font-semibold px-2 py-0.5 rounded-full border ${c.bg} ${c.text} ${c.border} hover:brightness-95 transition-all`}>
                      {label}
                    </button>
                  );
                })}
                <button onClick={clearMonth}
                  className="text-[11px] font-semibold px-2 py-0.5 rounded-full border border-gray-200 text-gray-400 hover:bg-gray-50 hover:text-gray-600 transition-colors ml-auto">
                  🗑 清空本月
                </button>
              </div>
            )}

            {/* 月曆 */}
            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 flex-1 relative overflow-hidden">

              {/* ── 主題背景圖（淡化浮水印）── */}
              {(MEMBER_THEMES[selectedId]?.bgImages || []).map((img, i) => (
                <img key={i} src={img.url} alt=""
                  className="absolute pointer-events-none select-none object-contain"
                  style={{ ...img.style, position: 'absolute', zIndex: 0 }}
                  draggable="false"
                />
              ))}

              {/* 星期標題列 */}
              <div className="relative z-10 grid grid-cols-7 border-b border-gray-100">
                {WEEKDAYS.map((w, i) => (
                  <div key={w} className={`py-3 text-center text-xs font-semibold tracking-widest
                    ${i === 0 ? 'text-rose-400' : i === 6 ? 'text-blue-400' : 'text-gray-400'}`}>
                    {w}
                  </div>
                ))}
              </div>

              <div className="relative z-10 grid grid-cols-7">
                {cells.map((day, idx) => {
                  if (!day) return <div key={`empty-${idx}`} className="aspect-square p-1" />;
                  const key       = dateKey(year, month, day);
                  const shift     = schedule[key];
                  const colors    = shift ? SHIFT_COLORS[shift] : null;
                  const todayMark = isToday(day);
                  const col       = idx % 7;
                  const isSharedOff = sharedOffDates.has(key);
                  const isCommonOff = commonOffDays.has(day);

                  const cellUrl = cellCombos ? cellCombos[(day - 1) % cellCombos.length] : null;

                  let longPressTimer = null;
                  return (
                    <div
                      key={day}
                      onClick={() => sharedOffMode ? toggleSharedOff(day) : cycleShift(day)}
                      onContextMenu={e => { e.preventDefault(); setOverviewDay(day); }}
                      onTouchStart={() => { longPressTimer = setTimeout(() => setOverviewDay(day), 500); }}
                      onTouchEnd={() => clearTimeout(longPressTimer)}
                      className={`day-cell relative aspect-square p-1 flex flex-col items-center justify-start pt-2
                        border-b border-r border-gray-50 last:border-r-0 overflow-hidden
                        ${isEditable || sharedOffMode ? 'cursor-pointer' : 'cursor-default'}
                        ${isSharedOff
                          ? 'bg-rose-100/85 ring-2 ring-inset ring-rose-300'
                          : shift && !cellUrl ? colors.bg + ' bg-opacity-80' : (isEditable && !cellUrl ? 'hover:bg-gray-50/70' : '')}`}
                    >
                      {/* 每格主題背景圖 */}
                      {cellUrl && (
                        <img src={cellUrl} alt=""
                          className="absolute inset-0 w-full h-full pointer-events-none select-none"
                          style={{ opacity: 0.38, zIndex: 0, objectFit: 'cover', objectPosition: 'center top' }}
                          draggable="false"
                          loading="lazy"
                        />
                      )}
                      {isSharedOff && (
                        <span className="absolute top-1 right-1 text-[10px]" style={{ zIndex: 2 }}>🌴</span>
                      )}
                      {isCommonOff && !isSharedOff && (
                        <span className="absolute top-0.5 right-0.5 text-[10px]" style={{ zIndex: 2 }}
                          title="所有人都休假">✨</span>
                      )}
                      <span style={{ position: 'relative', zIndex: 1 }}
                        className={`text-sm font-semibold w-7 h-7 flex items-center justify-center rounded-full
                        ${todayMark   ? 'bg-violet-500 text-white shadow-sm'
                          : isSharedOff ? 'text-rose-600'
                          : shift     ? `${colors.bg} ${colors.text} shadow-sm`
                          : col === 0 ? 'text-rose-400'
                          : col === 6 ? 'text-blue-400'
                          : 'text-gray-600'}`}>
                        {day}
                      </span>
                      {shift && (
                        <span style={{ position: 'relative', zIndex: 1 }}
                          className={`mt-1 text-xs font-medium ${colors.text} leading-none`}>
                          {SHIFT_LABELS[shift]}
                        </span>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            <p className="text-[11px] text-gray-300 text-center mt-1 mb-2 select-none">
              右鍵（或長按）任意日期 → 查看所有人班別
            </p>

            </div>{/* end p-6 wrapper */}
          </main>

          {/* ── 共同排休浮動列 ───────────────────────────────────── */}
          {sharedOffMode && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 flex items-center gap-3 bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-2xl">
              <span className="text-sm">
                🌴 已選 <span className="font-bold text-rose-300">{sharedOffDates.size}</span> 天
              </span>
              <button
                onClick={() => setSharedOffDates(new Set())}
                className="text-xs text-gray-400 hover:text-white transition-colors"
              >清除</button>
              <button
                onClick={() => { if (sharedOffDates.size > 0) setShowTgModal(true); }}
                disabled={sharedOffDates.size === 0}
                className="flex items-center gap-1.5 px-4 py-1.5 rounded-xl bg-sky-500 hover:bg-sky-400 disabled:opacity-40 text-sm font-semibold transition-colors"
              >
                ✈️ 發送 TG 通知
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
